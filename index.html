<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="DuckAi — a full chat client that runs entirely in your browser. No API key, no account.">
<title>DuckAi — چت</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="brand"><span class="logo">🦆</span><span>DuckAi</span></div>
      <button class="icon-btn only-mobile" id="closeSidebar" aria-label="close">✕</button>
    </div>
    <button class="new-chat" id="newChat">+ گفتگوی جدید</button>
    <div class="conv-list" id="convList"></div>
    <div class="sb-bottom">
      <button class="icon-btn" id="btnSettings" title="settings">⚙️</button>
      <button class="icon-btn" id="btnTheme" title="theme">🌙</button>
      <button class="icon-btn" id="btnLang" title="language">🌐</button>
      <a class="icon-btn" href="https://github.com/amirmahdipa77-tech/DuckAi" target="_blank" rel="noopener noreferrer" title="GitHub">⌨</a>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSidebar" aria-label="menu">☰</button>
      <button class="model-btn" id="modelBtn">
        <span class="dot"></span><span id="modelName">openai-fast</span><span class="chev">▾</span>
      </button>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnExport" title="export">⤓</button>
      <button class="icon-btn" id="btnNewTop" title="new">✎</button>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <h1 id="welcomeTitle">با <span class="grad">DuckAi</span> چت کن</h1>
        <p id="welcomeSub">بدون کلید API، بدون حساب، بدون اشتراک — مستقیم در مرورگر.</p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="chat-inner"><div class="messages" id="messages"></div></div>
    </section>

    <footer class="composer">
      <div class="composer-inner">
        <button class="mode-pill" id="imgToggle" title="image mode">🎨 حالت تصویر</button>
        <button class="icon-btn" id="btnMic" title="dictation">🎙️</button>
        <textarea id="input" rows="1" placeholder="پیامت را بنویس…"></textarea>
        <button class="send" id="btnSend" title="send">➤</button>
      </div>
      <div class="hint" id="hint"></div>
    </footer>
  </main>
</div>

<!-- settings -->
<div class="modal" id="settingsModal" hidden>
  <div class="sheet">
    <h2 class="i18n" data-k="settingsTitle">تنظیمات</h2>
    <div class="sub i18n" data-k="settingsSub">همه‌چیز فقط در همین مرورگر ذخیره می‌شود.</div>

    <div class="field">
      <label class="i18n" data-k="baseUrl">آدرس API (سازگار با OpenAI)</label>
      <input type="text" id="setBase" spellcheck="false" dir="ltr">
      <small>POST {model, messages, stream} → /chat/completions</small>
    </div>
    <div class="field">
      <label class="i18n" data-k="apiKey">کلید API (اختیاری)</label>
      <input type="password" id="setKey" spellcheck="false" dir="ltr" autocomplete="off" placeholder="sk-…">
    </div>
    <div class="field">
      <label class="i18n" data-k="model">مدل</label>
      <input type="text" id="setModel" spellcheck="false" dir="ltr">
    </div>
    <div class="field">
      <label class="i18n" data-k="temperature">خلاقیت (temperature)</label>
      <input type="number" id="setTemp" min="0" max="2" step="0.1">
    </div>
    <div class="field">
      <label class="i18n" data-k="system">دستور سیستمی</label>
      <textarea id="setSystem" placeholder="You are a helpful assistant…"></textarea>
    </div>
    <div class="switch"><span class="i18n" data-k="stream">پاسخ جریانی (streaming)</span><div class="toggle" id="setStream"></div></div>
    <div class="switch"><span class="i18n" data-k="ttsAuto">خواندن خودکار پاسخ‌ها</span><div class="toggle" id="setTts"></div></div>
    <div class="field" style="margin-top:12px">
      <label class="i18n" data-k="language">زبان رابط</label>
      <select id="setLang"><option value="fa">فارسی</option><option value="en">English</option></select>
    </div>
    <div class="field">
      <label class="i18n" data-k="themeLabel">تم</label>
      <select id="setTheme"><option value="dark">Dark</option><option value="light">Light</option></select>
    </div>

    <div class="sheet-foot">
      <button class="btn danger i18n" data-k="clearAll" id="clearChats">پاک کردن همهٔ گفتگوها</button>
      <button class="btn" id="closeSettings">بستن</button>
      <button class="btn primary" id="saveSettings">ذخیره</button>
    </div>
  </div>
</div>

<!-- model picker -->
<div class="modal" id="modelModal" hidden>
  <div class="sheet">
    <h2 id="modelModalTitle">انتخاب مدل</h2>
    <div class="sub">text.pollinations.ai · OpenAI-compatible</div>
    <div class="mlist" id="modelList"></div>
    <div class="sheet-foot">
      <button class="btn" id="btnRefreshModels">به‌روزرسانی فهرست</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="assets/app.js"></script>
</body>
</html>
